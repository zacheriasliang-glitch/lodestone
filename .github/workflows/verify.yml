name: Public download checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Public entry points
        run: python -B tools/release/smoke.py
      - name: Package file checksums
        run: python -B verify_download.py
      - name: Conscience regression checks
        run: python -B -m unittest discover -s tests/ecosystem -q
      - name: Download integrity regressions
        run: python -B -m unittest discover -s tests/release -q
      - name: Continuity checks
        run: python -B -m unittest discover -s tests/continuity -q
      - name: Local memory checks
        run: python -B -m unittest discover -s tools/local-memory/tests -q
      - name: Python orchestration checks
        if: runner.os != 'Windows'
        run: python -B -m unittest discover -s orchestrator/tests -q
      - name: Re-entry fold checks
        if: runner.os != 'Windows'
        run: python -B -m unittest discover -s tools/origami-fold/tests -q
      - name: Mailbox local fixture checks
        if: runner.os != 'Windows'
        run: python -B -m unittest discover -s tools/mailbox -p 'test_*.py' -q
      - name: Core contract checks (POSIX)
        if: runner.os != 'Windows'
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests/machinery -q
      - name: Corpus navigation checks
        if: runner.os != 'Windows'
        run: python -B -m unittest discover -s tools/corpus-fold/tests -q
      - name: Build downloads from committed source
        shell: bash
        run: python -B tools/release/package.py --output "$RUNNER_TEMP/lodestone-downloads"

  porcelain-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Optional dependency installation
        run: python -m pip install -r experiments/porcelain-simulator/requirements.txt
      - name: Optional simulator help only
        working-directory: experiments/porcelain-simulator
        run: python -B -m porcelain.run --help
