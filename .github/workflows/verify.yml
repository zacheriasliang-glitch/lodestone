name: Public download checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Public entry points
        run: python -B tools/release/smoke.py
      - name: Package file checksums
        run: python -B verify_download.py
      - name: Conscience regression checks
        run: python -B -m unittest discover -s tests/ecosystem -q
      - name: Download integrity regressions
        run: python -B -m unittest discover -s tests/release -q
      - name: Workflow dispatch adapter offline checks
        run: python -B -m unittest discover -s tests/github_actions -q
      - name: Structured decision contract checks
        run: python -B -m unittest discover -s tests/desktop -p 'test_decision_contract.py' -q
      - name: Optional local decoding format checks
        if: runner.os != 'Windows'
        run: python -B -m unittest discover -s tests/desktop -p 'test_decision_format.py' -q
      - name: Continuity checks
        run: python -B -m unittest discover -s tests/continuity -q
      - name: Local memory checks
        run: python -B -m unittest discover -s tools/local-memory/tests -q
      - name: Python orchestration checks
        if: runner.os != 'Windows'
        run: python -B -m unittest discover -s orchestrator/tests -q
      - name: Re-entry fold checks
        if: runner.os != 'Windows'
        run: python -B -m unittest discover -s tools/origami-fold/tests -q
      - name: Mailbox local fixture checks
        if: runner.os != 'Windows'
        run: python -B -m unittest discover -s tools/mailbox -p 'test_*.py' -q
      - name: Core contract checks (POSIX)
        if: runner.os != 'Windows'
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests/machinery -q
      - name: Corpus navigation checks
        if: runner.os != 'Windows'
        run: python -B -m unittest discover -s tools/corpus-fold/tests -q
      - name: Build downloads from committed source
        shell: bash
        run: python -B tools/release/package.py --output "$RUNNER_TEMP/lodestone-downloads"

  linux-isolation:
    # Proves the Linux kernel fence for command providers on a free public runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fence selection and refusal (simulated platforms)
        run: python -B -m unittest discover -s tests/desktop -p 'test_isolation.py' -v
      - name: Without bubblewrap, command providers are refused
        run: |
          if command -v bwrap; then
            echo "bubblewrap is preinstalled on this image; the no-fence case is covered by the simulated checks"
          else
            LODESTONE_EXPECT_ISOLATION=REFUSED python -B -m unittest discover -s tests/desktop -p 'test_isolation.py' -k HostOutcome -v
          fi
      - name: Install bubblewrap
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - name: "Stock Ubuntu 24.04 host with bubblewrap - fenced or refused, never unfenced"
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          python -B -m unittest discover -s tests/desktop -p 'test_isolation.py' -k HostOutcome -v
      - name: Opt-in admin step - scoped AppArmor profile for /usr/bin/bwrap only
        # The normal installer never runs this. The global restriction stays at 1.
        run: |
          ls /usr/share/apparmor/extra-profiles/ | grep -i bwrap || echo "no distribution bwrap profile"
          sudo "desktop/Enable Linux Command Fence.sh"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Real bubblewrap confinement on the restricted host (required, not skipped)
        env:
          LODESTONE_REQUIRE_BWRAP: '1'
          LODESTONE_EXPECT_ISOLATION: FENCED
        run: python -B -m unittest discover -s tests/desktop -p 'test_isolation.py' -v
      - name: Removing the profile returns the host to refusal
        env:
          LODESTONE_EXPECT_ISOLATION: REFUSED
        run: |
          sudo "desktop/Enable Linux Command Fence.sh" --remove
          python -B -m unittest discover -s tests/desktop -p 'test_isolation.py' -k HostOutcome -v

  windows-isolation:
    # Proves the Windows AppContainer fence for command providers on a free public runner.
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real AppContainer confinement and cleanup (required, not skipped)
        env:
          LODESTONE_REQUIRE_APPCONTAINER: '1'
          LODESTONE_EXPECT_ISOLATION: FENCED
        run: python -B -m unittest discover -s tests/desktop -p 'test_isolation.py' -v

  porcelain-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Optional dependency installation
        run: python -m pip install -r experiments/porcelain-simulator/requirements.txt
      - name: Optional simulator help only
        working-directory: experiments/porcelain-simulator
        run: python -B -m porcelain.run --help
      - name: Synthetic numerical guard checks
        working-directory: experiments/porcelain-simulator
        run: python -B -m unittest discover -s tests -p 'test_guardrails.py' -q
