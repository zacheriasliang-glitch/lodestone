name: AppContainer completion regression only
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed proof branch SHA; not release evidence
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      LODESTONE_REQUIRE_APPCONTAINER: '1'
      LODESTONE_FENCE_WAIT_SECONDS: '30'
      EXPECTED_HEAD: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Completion and recovery contracts
        id: completion
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests/desktop -p test_appcontainer_completion.py -v 2>&1 | tee "$RUNNER_TEMP/completion.log"
      - name: Real AppContainer and isolated launcher
        id: isolation
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests/desktop -p test_isolation.py -v 2>&1 | tee "$RUNNER_TEMP/isolation.log"
      - name: Native stop regression
        id: stop
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests/desktop -p test_windows_stop_completion.py -v 2>&1 | tee "$RUNNER_TEMP/stop.log"
      - name: Native sampling regression
        id: sampling
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests/desktop -p test_windows_snapshot_exit.py -v 2>&1 | tee "$RUNNER_TEMP/sampling.log"
      - name: Existing process regression
        id: process
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests/desktop -p test_portable_process.py -v 2>&1 | tee "$RUNNER_TEMP/process.log"
      - name: Preserve exact source and test receipts
        if: always()
        shell: python
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          head = subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          assert head == os.environ['EXPECTED_HEAD'] == os.environ['GITHUB_SHA']
          paths = ['desktop/runtime/src/lodestone_machinery/portable_process.py',
                   'desktop/runtime/src/lodestone_machinery/windows_appcontainer.py',
                   'tests/desktop/test_appcontainer_completion.py','tests/desktop/test_isolation.py',
                   'tests/desktop/test_windows_stop_completion.py','tests/desktop/test_windows_snapshot_exit.py',
                   'tests/desktop/test_portable_process.py']
          steps = json.loads(os.environ['STEP_OUTCOMES'])
          suites = {}
          for name in ('completion','isolation','stop','sampling','process'):
              path = Path(os.environ['RUNNER_TEMP']) / (name + '.log')
              raw = path.read_bytes() if path.is_file() else b''
              suites[name] = {'outcome':steps.get(name,{}).get('outcome','missing'),
                             'sha256':hashlib.sha256(raw).hexdigest(),
                             'log_base64':base64.b64encode(raw).decode()}
          report = {'schema':'lodestone-appcontainer-completion-proof/v1','source_commit':head,
                    'product_candidate':'db9d221e6872cbafff2690cd236edc359f30a990',
                    'release_evidence':False,'model_calls':0,'native_appcontainer_required':True,
                    'source_files':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths},
                    'suites':suites}
          raw = json.dumps(report,sort_keys=True,indent=2).encode()
          digest = hashlib.sha256(raw).hexdigest()
          print('LODESTONE_APPCONTAINER_PROOF_BEGIN '+digest+' '+str(len(raw)))
          encoded = base64.b64encode(raw).decode()
          for index,start in enumerate(range(0,len(encoded),2000)):
              print('LODESTONE_APPCONTAINER_PROOF_CHUNK '+str(index)+' '+encoded[start:start+2000])
          print('LODESTONE_APPCONTAINER_PROOF_END '+digest)
