name: Windows owned sampling regression only

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact proof branch SHA; never release evidence
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      EXPECTED_HEAD: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Bind exact reviewed source
        shell: python
        run: |
          import hashlib, os, re, subprocess
          from pathlib import Path
          expected = os.environ['EXPECTED_HEAD']
          reviewed = '0e3972cbb58fbe0084b86107ef95d1c65af26b3b'
          assert re.fullmatch(r'[0-9a-f]{40}', expected)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected
          changed = subprocess.check_output(['git', 'diff', '--name-only', reviewed, 'HEAD'], text=True).splitlines()
          assert changed == ['.github/workflows/desktop-portable.yml'], changed
          print('REVIEWED_PRODUCT_SOURCE=' + reviewed)
          print('EXACT_PROOF_HEAD=' + expected)
          for name in ('desktop/runtime/src/lodestone_machinery/portable_process.py',
                       'desktop/runtime/src/lodestone_machinery/loom_runtime.py',
                       'tests/desktop/test_windows_snapshot_exit.py',
                       'tests/desktop/test_windows_stop_completion.py',
                       'tests/desktop/test_portable_process.py'):
              print(hashlib.sha256(Path(name).read_bytes()).hexdigest() + '  ' + name)
      - name: Natural exit sampling and retained error regression without models
        shell: bash
        run: python -B -m unittest discover -s tests/desktop -p test_windows_snapshot_exit.py -v
      - name: Descendant completion regression without models
        if: always()
        shell: bash
        run: python -B -m unittest discover -s tests/desktop -p test_windows_stop_completion.py -v
      - name: Existing native ownership regression without models
        if: always()
        shell: bash
        run: python -B -m unittest discover -s tests/desktop -p test_portable_process.py -v
