name: Windows natural-exit sampling diagnostic only

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact diagnostic branch SHA; never release evidence
        type: string
        required: true

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Observe existing native RSS sampling during natural exits
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/desktop_windows_snapshot_diagnostic.py --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/windows-snapshot-diagnostic.json" --expected-head "$EXPECTED_HEAD"
      - name: Preserve exact diagnostic JSON in logs
        if: always()
        shell: python
        run: |
          import base64, hashlib, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'windows-snapshot-diagnostic.json'
          if not path.is_file():
              raise SystemExit('Diagnostic did not create its required receipt')
          raw = path.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          print('LODESTONE_SNAPSHOT_DIAGNOSTIC_BEGIN ' + digest + ' ' + str(len(raw)))
          encoded = base64.b64encode(raw).decode()
          for index, start in enumerate(range(0, len(encoded), 2000)):
              print('LODESTONE_SNAPSHOT_DIAGNOSTIC_CHUNK ' + str(index) + ' ' + encoded[start:start + 2000])
          print('LODESTONE_SNAPSHOT_DIAGNOSTIC_END ' + digest)
